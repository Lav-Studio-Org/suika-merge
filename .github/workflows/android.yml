name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # offset keeps every CI build above any version already uploaded to Play
      - name: Set version code
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      - name: Build web bundle and sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      # Signing is optional: without these secrets only the debug APK is built.
      - name: Load release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build signed release (AAB for Play Store)
        if: env.ANDROID_KEYSTORE_FILE != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/suika-angka-debug.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab dist/suika-angka-release.aab
          fi

      # Same game under a second Play package, as its own AAB next to the main one.
      - name: Build signed release for com.prasetyo.suikaangka
        if: env.ANDROID_KEYSTORE_FILE != ''
        working-directory: android
        env:
          APP_ID: com.prasetyo.suikaangka
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../dist/suika-angka-prasetyo-release.aab
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: suika-angka-android-${{ github.run_number }}
          path: dist/

      # A fixed "android-latest" release gives a stable download link for testing on a phone.
      - name: Publish test build to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android test build #${{ github.run_number }}" \
            --notes "APK debug untuk dicoba di HP. suika-angka-release.aab (kalau ada) adalah file bertanda tangan untuk upload ke Play Console. Build otomatis dari commit ${GITHUB_SHA::7}."
